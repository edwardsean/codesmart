events {}

server {
    listen 443 ssl;

     # WebSocket → Go directly
    location ~ ^/api/v1/projects/.*/terminal$  {
        proxy_pass http://backend:8080;

        # these headers are required for WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # keep connection alive for 1 hour
    }

    # REST API → Next.js
    location /api/ {
        proxy_pass http://frontend:3000;
    }

    # ── Everything else → Next.js frontend ──
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

nginx handles:
  → SSL termination (HTTPS certificates)
  → Load balancing (multiple instances)
  → Rate limiting
  → WebSocket upgrade headers
  → Serving static files (faster than Node.js)
  → Routing to correct service

Result:
  → All services stay private 
  → One SSL certificate to manage 
  → One place to add rate limiting 
  → One place to add logging 