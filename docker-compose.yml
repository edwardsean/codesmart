  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  #   volumes:
  #     - neo4j_data:/data
    
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.dev
    container_name: codesmart-frontend
    ports:
      - "3000:3000"
    volumes :
      - ./frontend:/app
      - node_modules:/app/node_modules
    env_file:
      - "./frontend/.env"
    environment: 
      - NEXT_PUBLIC_WS_URL=wss://yourdomain.com
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - BACKEND_URL=http://backend:8080
      

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    container_name: codesmart-backend
    expose:
      - "8080"
    env_file:
      - "./backend/.env"
    environment:
      - BACKEND_ORIGIN=backend:8080
      - FRONTEND_ORIGIN=http://frontend:3000
    depends_on:
      - frontend
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    command: air -c .air.toml

